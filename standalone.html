<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 MotivationHub - Motivation & Tâches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #1a1625, #3d1f4d, #0f0f1e);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard({ tasks, objectives, streak, stats }) {
            const badges = useMemo(() => {
                const earned = [];
                if (streak >= 7) earned.push({ id: 'week-streak', name: '7 Days Streak', icon: '🔥' });
                if (streak >= 30) earned.push({ id: 'month-streak', name: '30 Days Streak', icon: '⚡' });
                if (stats.level >= 5) earned.push({ id: 'level-5', name: 'Level 5', icon: '⭐' });
                if (tasks.filter(t => t.completed).length >= 10) earned.push({ id: 'ten-tasks', name: '10 Tasks Done', icon: '✨' });
                return earned;
            }, [streak, stats.level, tasks]);

            const completionRate = tasks.length > 0
                ? Math.round((tasks.filter(t => t.completed).length / tasks.length) * 100)
                : 0;

            return (
                <div className="space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <StatCard title="Level" value={stats.level} icon="🎮" subtitle={`${stats.xp}/100 XP`} />
                        <StatCard title="Streak" value={`${streak} 🔥`} icon="🏆" subtitle="jours consécutifs" />
                        <StatCard title="Tâches" value={`${tasks.filter(t => t.completed).length}/${tasks.length}`} icon="✅" subtitle={`${completionRate}% complétées`} />
                        <StatCard title="Objectifs" value={objectives.length} icon="🎯" subtitle={`${objectives.filter(o => o.progress === 100).length} terminés`} />
                    </div>

                    <div className="bg-gradient-to-r from-purple-900/50 to-black/50 border border-purple-500/30 rounded-2xl p-6">
                        <h3 className="text-lg font-semibold mb-3">Progression du Niveau</h3>
                        <div className="w-full bg-gray-800/50 rounded-full h-4 overflow-hidden">
                            <div className="bg-gradient-to-r from-purple-500 to-pink-500 h-full transition-all duration-300" style={{ width: `${stats.xp}%` }}></div>
                        </div>
                        <p className="text-sm text-gray-400 mt-2">{stats.xp}/100 XP</p>
                    </div>

                    {badges.length > 0 && (
                        <div className="bg-gradient-to-r from-purple-900/50 to-black/50 border border-purple-500/30 rounded-2xl p-6">
                            <h3 className="text-lg font-semibold mb-4">🏅 Badges Débloqués</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {badges.map(badge => (
                                    <div key={badge.id} className="bg-black/50 border border-yellow-500/30 rounded-xl p-4 text-center hover:border-yellow-500 transition">
                                        <div className="text-3xl mb-2">{badge.icon}</div>
                                        <p className="text-sm font-medium">{badge.name}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="bg-gradient-to-r from-purple-900/50 to-pink-900/50 border border-purple-500/30 rounded-2xl p-8 text-center">
                        <p className="text-xl italic text-gray-200 mb-2">"La seule façon de faire du bon travail, c'est d'aimer ce que tu fais."</p>
                        <p className="text-sm text-gray-400">— Steve Jobs</p>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, subtitle }) {
            return (
                <div className="bg-gradient-to-br from-purple-900/50 to-black/50 border border-purple-500/30 rounded-2xl p-6 hover:border-purple-500/50 transition">
                    <div className="flex items-center justify-between mb-2">
                        <p className="text-gray-400 text-sm">{title}</p>
                        <span className="text-2xl">{icon}</span>
                    </div>
                    <p className="text-3xl font-bold text-white mb-1">{value}</p>
                    {subtitle && <p className="text-xs text-gray-400">{subtitle}</p>}
                </div>
            );
        }

        function TaskManager({ tasks, onAdd, onComplete, onDelete }) {
            const [newTask, setNewTask] = useState('');
            const [category, setCategory] = useState('general');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (newTask.trim()) {
                    onAdd({ title: newTask, category, priority: 'normal' });
                    setNewTask('');
                }
            };

            const categories = {
                general: '🎯',
                health: '💪',
                work: '💼',
                learning: '📚',
                creativity: '🎨',
                social: '👥'
            };

            const activeTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);

            return (
                <div className="space-y-8">
                    <form onSubmit={handleSubmit} className="bg-gradient-to-r from-purple-900/50 to-black/50 border border-purple-500/30 rounded-2xl p-6">
                        <h2 className="text-xl font-semibold mb-4">➕ Ajouter une Tâche</h2>
                        <div className="space-y-4">
                            <input
                                type="text"
                                value={newTask}
                                onChange={(e) => setNewTask(e.target.value)}
                                placeholder="Qu'est-ce que tu veux accomplir ?"
                                className="w-full bg-black/30 border border-purple-500/30 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500"
                            />
                            <div className="flex gap-3">
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="bg-black/30 border border-purple-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500"
                                >
                                    {Object.entries(categories).map(([key, icon]) => (
                                        <option key={key} value={key}>{icon} {key}</option>
                                    ))}
                                </select>
                                <button
                                    type="submit"
                                    className="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 rounded-lg px-6 py-2 font-semibold transition"
                                >
                                    Ajouter
                                </button>
                            </div>
                        </div>
                    </form>

                    {activeTasks.length > 0 && (
                        <div>
                            <h3 className="text-lg font-semibold mb-4">📋 Tâches en Cours ({activeTasks.length})</h3>
                            <div className="space-y-2">
                                {activeTasks.map(task => (
                                    <TaskItem key={task.id} task={task} categories={categories} onComplete={onComplete} onDelete={onDelete} />
                                ))}
                            </div>
                        </div>
                    )}

                    {completedTasks.length > 0 && (
                        <div>
                            <h3 className="text-lg font-semibold mb-4">✨ Tâches Complétées ({completedTasks.length})</h3>
                            <div className="space-y-2">
                                {completedTasks.map(task => (
                                    <TaskItem key={task.id} task={task} categories={categories} onComplete={onComplete} onDelete={onDelete} />
                                ))}
                            </div>
                        </div>
                    )}

                    {tasks.length === 0 && (
                        <div className="text-center py-12 bg-gradient-to-r from-purple-900/30 to-black/30 border border-purple-500/20 rounded-2xl">
                            <p className="text-gray-400 mb-2">Tu n'as pas de tâches pour le moment...</p>
                            <p className="text-sm text-gray-500">Ajoute-en une ci-dessus pour commencer ! 🚀</p>
                        </div>
                    )}
                </div>
            );
        }

        function TaskItem({ task, categories, onComplete, onDelete }) {
            return (
                <div className={`bg-gradient-to-r ${task.completed ? 'from-gray-800/30 to-gray-900/30' : 'from-purple-900/30 to-black/30'} border ${task.completed ? 'border-gray-500/20' : 'border-purple-500/30'} rounded-lg p-4 flex items-center gap-4 group hover:border-purple-500/50 transition`}>
                    <button
                        onClick={() => onComplete(task.id)}
                        className={`flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${task.completed ? 'bg-green-500/50 border-green-500 text-white' : 'border-gray-500/50 hover:border-green-500'}`}
                    >
                        {task.completed && '✓'}
                    </button>
                    <div className="flex-1">
                        <p className={`font-medium ${task.completed ? 'line-through text-gray-500' : 'text-white'}`}>
                            {categories[task.category]} {task.title}
                        </p>
                    </div>
                    <button
                        onClick={() => onDelete(task.id)}
                        className="flex-shrink-0 text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"
                    >
                        🗑️
                    </button>
                </div>
            );
        }

        function ObjectiveManager({ objectives, onAdd, onUpdate, onDelete }) {
            const [newObjective, setNewObjective] = useState('');
            const [duration, setDuration] = useState('month');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (newObjective.trim()) {
                    onAdd({ title: newObjective, duration, progress: 0 });
                    setNewObjective('');
                }
            };

            const shortTermObjectives = objectives.filter(o => o.duration === 'week');
            const mediumTermObjectives = objectives.filter(o => o.duration === 'month');
            const longTermObjectives = objectives.filter(o => o.duration === 'year');

            return (
                <div className="space-y-8">
                    <form onSubmit={handleSubmit} className="bg-gradient-to-r from-purple-900/50 to-black/50 border border-purple-500/30 rounded-2xl p-6">
                        <h2 className="text-xl font-semibold mb-4">🎯 Ajouter un Objectif</h2>
                        <div className="space-y-4">
                            <input
                                type="text"
                                value={newObjective}
                                onChange={(e) => setNewObjective(e.target.value)}
                                placeholder="Quel est ton objectif ?"
                                className="w-full bg-black/30 border border-purple-500/30 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500"
                            />
                            <div className="flex gap-3">
                                <select
                                    value={duration}
                                    onChange={(e) => setDuration(e.target.value)}
                                    className="bg-black/30 border border-purple-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500"
                                >
                                    <option value="week">📅 Cette semaine</option>
                                    <option value="month">📆 Ce mois-ci</option>
                                    <option value="year">📊 Cette année</option>
                                </select>
                                <button type="submit" className="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 rounded-lg px-6 py-2 font-semibold transition">Créer</button>
                            </div>
                        </div>
                    </form>

                    {shortTermObjectives.length > 0 && <ObjectiveSection title="📅 Objectifs de la Semaine" objectives={shortTermObjectives} onUpdate={onUpdate} onDelete={onDelete} />}
                    {mediumTermObjectives.length > 0 && <ObjectiveSection title="📆 Objectifs du Mois" objectives={mediumTermObjectives} onUpdate={onUpdate} onDelete={onDelete} />}
                    {longTermObjectives.length > 0 && <ObjectiveSection title="📊 Objectifs de l'Année" objectives={longTermObjectives} onUpdate={onUpdate} onDelete={onDelete} />}

                    {objectives.length === 0 && (
                        <div className="text-center py-12 bg-gradient-to-r from-purple-900/30 to-black/30 border border-purple-500/20 rounded-2xl">
                            <p className="text-gray-400 mb-2">Aucun objectif défini...</p>
                            <p className="text-sm text-gray-500">Crée-en un pour te motiver ! 🚀</p>
                        </div>
                    )}
                </div>
            );
        }

        function ObjectiveSection({ title, objectives, onUpdate, onDelete }) {
            return (
                <div>
                    <h3 className="text-lg font-semibold mb-4">{title}</h3>
                    <div className="space-y-4">
                        {objectives.map(obj => (
                            <ObjectiveCard key={obj.id} objective={obj} onUpdate={onUpdate} onDelete={onDelete} />
                        ))}
                    </div>
                </div>
            );
        }

        function ObjectiveCard({ objective, onUpdate, onDelete }) {
            const [isEditing, setIsEditing] = useState(false);
            const [tempProgress, setTempProgress] = useState(objective.progress);

            const handleSave = () => {
                onUpdate(objective.id, { progress: parseInt(tempProgress) || 0 });
                setIsEditing(false);
            };

            return (
                <div className="bg-gradient-to-r from-purple-900/30 to-black/30 border border-purple-500/30 rounded-lg p-5 group hover:border-purple-500/50 transition">
                    <div className="flex items-start justify-between mb-4">
                        <h4 className="font-semibold text-white">{objective.title}</h4>
                        <button onClick={() => onDelete(objective.id)} className="text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">🗑️</button>
                    </div>

                    <div className="space-y-3">
                        <div>
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-sm text-gray-400">Progression</span>
                                {isEditing ? (
                                    <input type="number" min="0" max="100" value={tempProgress} onChange={(e) => setTempProgress(e.target.value)} className="w-16 bg-black/30 border border-purple-500/30 rounded px-2 py-1 text-white text-sm" />
                                ) : (
                                    <span className="text-sm font-medium text-purple-400">{objective.progress}%</span>
                                )}
                            </div>
                            <div className="w-full bg-gray-800/50 rounded-full h-2 overflow-hidden">
                                <div className="bg-gradient-to-r from-blue-500 to-cyan-500 h-full transition-all duration-300" style={{ width: `${objective.progress}%` }}></div>
                            </div>
                        </div>

                        <div className="flex gap-2">
                            {isEditing ? (
                                <>
                                    <button onClick={handleSave} className="flex-1 bg-green-600/50 hover:bg-green-600 border border-green-500/30 rounded px-3 py-2 text-sm font-medium transition">✓ Enregistrer</button>
                                    <button onClick={() => { setTempProgress(objective.progress); setIsEditing(false); }} className="flex-1 bg-gray-600/50 hover:bg-gray-600 border border-gray-500/30 rounded px-3 py-2 text-sm font-medium transition">Annuler</button>
                                </>
                            ) : (
                                <>
                                    <button onClick={() => setIsEditing(true)} className="flex-1 bg-purple-600/50 hover:bg-purple-600 border border-purple-500/30 rounded px-3 py-2 text-sm font-medium transition">✏️ Éditer</button>
                                    <button onClick={() => onUpdate(objective.id, { progress: Math.min(objective.progress + 10, 100) })} className="flex-1 bg-blue-600/50 hover:bg-blue-600 border border-blue-500/30 rounded px-3 py-2 text-sm font-medium transition">+10%</button>
                                </>
                            )}
                        </div>

                        {objective.progress === 100 && (
                            <div className="text-center py-2 bg-green-500/20 border border-green-500/30 rounded">
                                <p className="text-sm font-semibold text-green-400">🎉 Objectif Complété !</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [tasks, setTasks] = useState([]);
            const [objectives, setObjectives] = useState([]);
            const [streak, setStreak] = useState(0);
            const [stats, setStats] = useState({ completed: 0, total: 0, level: 1, xp: 0 });

            useEffect(() => {
                const saved = localStorage.getItem('motivationApp');
                if (saved) {
                    const data = JSON.parse(saved);
                    setTasks(data.tasks || []);
                    setObjectives(data.objectives || []);
                    setStreak(data.streak || 0);
                    setStats(data.stats || { completed: 0, total: 0, level: 1, xp: 0 });
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('motivationApp', JSON.stringify({ tasks, objectives, streak, stats }));
            }, [tasks, objectives, streak, stats]);

            const handleAddTask = (task) => {
                setTasks([...tasks, { ...task, id: Date.now(), completed: false, createdAt: new Date() }]);
            };

            const handleCompleteTask = (id) => {
                const task = tasks.find(t => t.id === id);
                if (!task.completed) {
                    setTasks(tasks.map(t => t.id === id ? { ...t, completed: true } : t));

                    const xpGain = 10;
                    const newXp = stats.xp + xpGain;
                    const newLevel = Math.floor(newXp / 100) + 1;

                    setStats({
                        completed: stats.completed + 1,
                        total: tasks.length,
                        level: newLevel,
                        xp: newXp % 100
                    });

                    const today = new Date().toDateString();
                    const lastCompleted = localStorage.getItem('lastCompleted');
                    if (lastCompleted !== today) {
                        setStreak(streak + 1);
                        localStorage.setItem('lastCompleted', today);
                    }
                }
            };

            const handleDeleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            const handleAddObjective = (objective) => {
                setObjectives([...objectives, { ...objective, id: Date.now(), progress: 0, createdAt: new Date() }]);
            };

            const handleUpdateObjective = (id, updates) => {
                setObjectives(objectives.map(o => o.id === id ? { ...o, ...updates } : o));
            };

            const handleDeleteObjective = (id) => {
                setObjectives(objectives.filter(o => o.id !== id));
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white">
                    <nav className="bg-black/50 backdrop-blur-md border-b border-purple-500/20 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent">🚀 MotivationHub</h1>
                                <div className="flex gap-4">
                                    {[
                                        { tab: 'dashboard', label: '📊 Dashboard' },
                                        { tab: 'tasks', label: '✅ Tâches' },
                                        { tab: 'objectives', label: '🎯 Objectifs' }
                                    ].map(({ tab, label }) => (
                                        <button
                                            key={tab}
                                            onClick={() => setActiveTab(tab)}
                                            className={`px-4 py-2 rounded-lg transition ${activeTab === tab ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            {label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'dashboard' && <Dashboard tasks={tasks} objectives={objectives} streak={streak} stats={stats} />}
                        {activeTab === 'tasks' && <TaskManager tasks={tasks} onAdd={handleAddTask} onComplete={handleCompleteTask} onDelete={handleDeleteTask} />}
                        {activeTab === 'objectives' && <ObjectiveManager objectives={objectives} onAdd={handleAddObjective} onUpdate={handleUpdateObjective} onDelete={handleDeleteObjective} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
